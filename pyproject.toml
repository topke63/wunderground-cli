[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wunderground-cli"
version = "0.2.0"
description = "Linux CLI for Weather Underground PWS conditions and forecasts (port of plasmoid-wunderground)"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.9"
keywords = ["weather", "wunderground", "pws", "cli", "forecast"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "rich>=13.7",
]

[project.urls]
Homepage = "https://github.com/topke63/wunderground-cli"
Issues = "https://github.com/topke63/wunderground-cli/issues"

[project.scripts]
wu = "wunderground_cli.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/wunderground_cli"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
