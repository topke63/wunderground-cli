[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wunderground-cli"
version = "0.1.0"
description = "Linux CLI for Weather Underground PWS conditions and forecasts (port of plasmoid-wunderground)"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "rich>=13.7",
]

[project.scripts]
wu = "wunderground_cli.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/wunderground_cli"]
